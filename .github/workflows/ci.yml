name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,service,connectors]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy || true   # advisory until annotations are complete

      - name: Tests
        # The replay provider makes the suite hermetic: no API key, no network.
        run: pytest --cov --cov-report=term-missing

  evaluate:
    # Quality gate. legiswatch-eval exits non-zero if any obligation was
    # auto-filed that the gold set says is wrong, so a prompt or threshold
    # change that degrades safety fails the build rather than shipping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Evaluate against gold set
        run: legiswatch-eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: out/eval_report.json
