[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legiswatch"
version = "1.0.0"
description = "Guardrailed extraction of compliance obligations from legal text, with deterministic provenance checks and a reviewable audit trail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shivani M. Latkar" }]
keywords = [
    "llm", "guardrails", "compliance", "information-extraction",
    "hallucination-detection", "langgraph", "human-in-the-loop", "govtech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
connectors = ["requests>=2.31"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
ollama = ["ollama>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
legiswatch-run = "legiswatch.cli:main"
legiswatch-eval = "legiswatch.evaluate:main"
legiswatch-review = "legiswatch.review_cli:main"

[project.urls]
Homepage = "https://github.com/ShivaniMLatkar/legiswatch"
Repository = "https://github.com/ShivaniMLatkar/legiswatch"
Issues = "https://github.com/ShivaniMLatkar/legiswatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/legiswatch"]
force-include = { "data" = "legiswatch/data" }

[tool.hatch.build.targets.sdist]
include = ["src/legiswatch", "data", "tests", "scripts", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "B008",   # FastAPI dependency defaults are call-in-default by design
    "RUF012", # mutable class attrs are pydantic fields here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
"scripts/*" = ["E402"]
# RUF001 flags "ambiguous" Unicode characters. In these modules the characters
# are the subject of the code, not an accident: the normaliser exists precisely
# to fold curly quotes, dashes and non-breaking spaces onto ASCII before a quote
# is compared with its source. Rewriting them would delete the behaviour.
"src/legiswatch/nodes/verify.py" = ["RUF001"]
"tests/test_pipeline.py" = ["RUF001"]
# Multiplication sign used in rendered console output.
"src/legiswatch/review_cli.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["legiswatch"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:legiswatch.*"]

[tool.coverage.run]
source = ["src/legiswatch"]
omit = ["*/dashboard.py"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
packages = ["legiswatch"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "rapidfuzz.*", "ollama.*"]
ignore_missing_imports = true
